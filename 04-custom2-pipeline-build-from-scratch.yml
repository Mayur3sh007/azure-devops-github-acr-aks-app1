

trigger:
- main

# We can define variables
variables:
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build Stage
    jobs:
      - job: Build 
        displayName: Build Job
        pool:
          vmImage: 'ubuntu-latest' # The VM image used to run our pipeline job
        steps:
        # Task 1 build docker img & push to acr
        - task: Docker@2
          inputs:
            containerRegistry: 'manual-aksdevopsacr-svc'
            repository: 'custom2nginixapp1'
            command: 'buildAndPush'
            Dockerfile: '**/Dockerfile'
            # we will get 2 images 1st is normal tag & 2nd one tag img with git commit version tag
            tags: |
              $(tag)
              $(Build.SourceVersion) 
        # Task-2: Copy files (Copy files from a source folder to target folder)
        # Source Directory: $(System.DefaultWorkingDirectory)/kube-manifests
        # Target Directory: $(Build.ArtifactStagingDirectory)
        - task: CopyFiles@2
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)/manifests'
            Contents: '**'
            TargetFolder: '$(Build.ArtifactStagingDirectory)'
            OverWrite: true

        # Task-3: Publish build artifacts (Publish build to Azure Pipelines)           
        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'manifests'
            publishLocation: 'Container'